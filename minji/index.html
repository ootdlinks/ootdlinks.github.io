<!doctype html>
<html lang="ko">
<head>
<base href="../">
<script>window.CHANNEL="minji";window.DATA_V="20261113180932";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="영상 속 그 옷, 룩 번호로 찾아보세요">
<meta property="og:title" content="코디 스토어">
<meta property="og:description" content="영상 속 그 옷, 룩 번호로 찾아보세요">
<meta name="theme-color" content="#14101f">
<title>코디 스토어</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#14101f; --surface:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
    --text:#f6f2ff; --dim:#a79fc0; --accent:#ff9fc4; --accent-ink:#2a0f1d; --warn:#ffd27a;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{padding:0 16px;min-height:100vh;background:radial-gradient(60% 40% at 80% 0%,rgba(255,159,196,.16),transparent 60%),radial-gradient(60% 40% at 0% 30%,rgba(124,110,255,.14),transparent 60%),var(--bg)}
  .wrap{max-width:480px;margin:0 auto;padding:28px 0 48px}
  header{text-align:center;margin-bottom:22px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--dim);font-size:14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
  .tab{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
  .pov{font-size:13px;color:var(--accent);margin:0 0 14px}
  .look{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:16px}
  .look h2{font-size:16px;margin:0 0 10px}
  .look h2 span{color:var(--accent);margin-right:6px}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px}
  .gallery img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#222}
  .items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  a.item{display:block;padding:8px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.04);color:var(--text);text-decoration:none}
  a.item img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#222}
  .name{margin-top:8px;font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.7em}
  .price{margin-top:4px;font-size:13px;color:var(--accent);font-weight:600}
  .tag{display:inline-block;margin-top:5px;padding:1px 7px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);font-size:11px;font-weight:500}
  .go{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
  footer{margin-top:24px;color:var(--dim);font-size:12px;line-height:1.7;text-align:center}
  .gallery img{cursor:zoom-in}
  .gallery.one{grid-template-columns:minmax(0,1fr);width:calc((100% - 12px)/3);margin:0 auto 14px}
  .search{position:relative;margin:0 0 14px}
  .search input{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:12px 40px 12px 40px;border-radius:999px;font:inherit;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--dim)}
  .search input:focus{border-color:var(--accent)}
  .search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px;pointer-events:none}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:var(--text);font-size:14px;line-height:1;cursor:pointer;display:none}
  .search.has .clr{display:block}
  .allbtn{display:block;text-align:center;margin:0 0 16px;padding:13px 14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;text-decoration:none}
  .epfollow{margin:0 0 14px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.6}
  .eplabel{font-size:12px;color:var(--accent);margin:0 0 6px}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:36px 0}
  .count{color:var(--dim);font-size:12px;margin:0 0 10px}
  .lb{position:fixed;inset:0;z-index:50;background:rgba(10,7,18,.92);display:none;align-items:center;justify-content:center;padding:56px 12px 24px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;touch-action:pan-y}
  .lb button{position:absolute;border:0;color:#fff;background:rgba(255,255,255,.14);width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb .x{top:max(12px,env(safe-area-inset-top));right:14px}
  .lb .pv{left:10px;top:50%;transform:translateY(-50%)}
  .lb .nx{right:10px;top:50%;transform:translateY(-50%)}
  .lb .cnt{position:absolute;top:max(22px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">코디 스토어</h1>
    <p>영상 속 그 옷, 룩 번호로 찾아보세요</p>
  </header>
  <a class="allbtn" id="allbtn" href="./" style="display:none">👗 전체 옷 보러가기</a>
  <div class="search" id="searchbox">
    <span class="ico" aria-hidden="true">🔍</span>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="옷·룩·에피소드 검색 (예: 가디건, EP002, 트렌치)" aria-label="검색">
    <button class="clr" id="qclr" type="button" aria-label="검색어 지우기">✕</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="pov" id="pov"></p>
  <main id="looks"></main>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
    <span class="cnt" id="lbcnt"></span>
    <button class="x" id="lbx" aria-label="닫기">✕</button>
    <button class="pv" id="lbpv" aria-label="이전 사진">‹</button>
    <img id="lbimg" alt="">
    <button class="nx" id="lbnx" aria-label="다음 사진">›</button>
  </div>
  <footer>
    이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>
    사진은 AI로 생성한 이미지예요. 실제 상품과 색상·핏이 다를 수 있으니 상품 페이지의 색상·사이즈 옵션을 꼭 확인해 주세요.<br>
    어떤 옷이 많이 눌리는지 알려고 방문·클릭 수를 익명 숫자로만 집계해요(이름·연락처·IP는 저장하지 않아요).
  </footer>
</div>
<script>document.write('<script src="channels.js?v='+(window.DATA_V||1)+'"><\/script>');</script>
<script>
  // window.CHANNEL(채널 폴더의 index.html이 지정)에 맞는 데이터·이름을 읽는다
  const CH = window.CHANNELS.find(c=>c.slug===window.CHANNEL) || window.CHANNELS[0];
  document.write('<script src="data/'+CH.slug+'.js?v='+(window.DATA_V||1)+'"><\/script>');
</script>
<script>
  const $ = id => document.getElementById(id);
  // 탭 순서: 최신 편이 가장 왼쪽, 오른쪽으로 갈수록 이전 편(편 번호 내림차순, 데이터에는 아무 순서로 넣어도 됨)
  const tabKey = t => (/^OOTD/i.test(String(t)) ? 1000 : 0) + (parseInt(String(t).replace(/\D/g,''))||0); // OOTD 편이 옛 EP 편보다 항상 최신
  EPISODES.sort((x,y)=>tabKey(y.tab)-tabKey(x.tab));
  $('h1').textContent = CH.emoji + ' ' + CH.name + ' 스토어';
  document.title = CH.name + ' 스토어';
  document.querySelector('meta[property="og:title"]').content = CH.name + ' 스토어';
  const won = n => n ? n.toLocaleString('ko-KR') + '원' : '';
  function lookHtml(ep,l,n,label){
    const gal = (l.imgs||[]).slice(0,3).map(f=>'<img loading="lazy" src="img/'+CH.slug+'/'+f+'" alt="'+l.name+'">').join('');
    const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    const items = l.items.filter(it=>!it.hide).map((it,ii)=>
      '<a class="item" href="'+it.url+'" target="_blank" rel="noopener sponsored" data-i="'+(ii+1)+'" data-name="'+esc(it.name)+'" data-price="'+(it.price||0)+'">' +
      '<img loading="lazy" src="img/'+CH.slug+'/'+it.img+'" alt="">' +
      '<div class="name">'+it.name+'</div><div class="price">'+won(it.price)+'</div>' +
      (it.ok?'':'<span class="tag">색상 확인 중</span>') + '<span class="go">보러가기 ›</span></a>').join('');
    return '<section class="look" data-ep="'+esc(ep.tab)+'" data-look="'+(n+1)+'">' + (label?'<div class="eplabel">'+(ep.label||ep.tab)+(ep.pov?' · POV : '+ep.pov:'')+'</div>':'') + '<h2><span>Look '+(n+1)+'</span>'+l.name+'</h2>' + (gal?'<div class="gallery'+((l.imgs||[]).length===1?' one':'')+'">'+gal+'</div>':'') + '<div class="items">'+items+'</div>' + '</section>';
  }
  function render(i){
    const ep = EPISODES[i]; if(!ep) return;
    [...$('tabs').children].forEach((b,j)=>b.setAttribute('aria-selected', j===i));
    $('pov').textContent = ep.pov ? 'POV : ' + ep.pov : '';
    $('looks').innerHTML = ep.looks.map((l,n)=>lookHtml(ep,l,n,false)).join('');
  }
  // 검색: 에피소드 번호·POV·룩 이름·상품명에서 찾는다(공백으로 나눈 낱말이 모두 들어 있어야 함)
  const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'');
  function search(q){
    const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean).map(norm);
    const whole = norm(q);
    const hits = [];
    EPISODES.forEach(ep=>ep.looks.forEach((l,n)=>{
      const hay = norm([ep.tab, ep.label, ep.pov, 'look'+(n+1), l.name].concat(l.items.filter(it=>!it.hide).map(it=>it.name)).join(' '));
      hits.push({ep,l,n,whole:hay.includes(whole),all:toks.every(t=>hay.includes(t))});
    }));
    // 입력한 문구 그대로 들어 있는 룩을 먼저 쓰고, 없으면 낱말별로 모두 들어 있는 룩을 보여 준다
    const exact = hits.filter(h=>h.whole);
    return (exact.length ? exact : hits.filter(h=>h.all)).map(h=>lookHtml(h.ep,h.l,h.n,true));
  }
  let curTab = 0; // 가장 왼쪽(최신)이 기본
  function onSearch(){
    const q = $('q').value;
    $('searchbox').classList.toggle('has', !!q);
    if(!q.trim()){ $('tabs').style.display=''; $('pov').style.display=''; render(curTab); return; }
    $('tabs').style.display='none'; $('pov').style.display='none';
    const res = search(q);
    $('looks').innerHTML = res.length ? '<p class="count">검색 결과 '+res.length+'개 룩</p>'+res.join('') : '<p class="empty">"'+q.replace(/</g,'&lt;')+'" 검색 결과가 없어요.<br>다른 낱말로 찾아 보세요.</p>';
  }
  $('q').addEventListener('input', onSearch);
  $('qclr').onclick = ()=>{ $('q').value=''; onSearch(); $('q').focus(); };
  // 사진 크게 보기: 갤러리 사진을 누르면 확대, ✕·바깥 영역·Esc로 닫기, ‹ › 와 좌우 스와이프로 넘기기
  let lbList=[], lbIdx=0;
  const lb=$('lb'), lbimg=$('lbimg');
  function lbShow(){ lbimg.src=lbList[lbIdx]; $('lbcnt').textContent=(lbIdx+1)+' / '+lbList.length; const many=lbList.length>1; $('lbpv').style.display=$('lbnx').style.display=many?'flex':'none'; }
  function lbOpen(list,i){ lbList=list; lbIdx=i; lbShow(); lb.classList.add('on'); document.body.style.overflow='hidden'; }
  function lbClose(){ lb.classList.remove('on'); document.body.style.overflow=''; lbimg.removeAttribute('src'); }
  function lbMove(d){ lbIdx=(lbIdx+d+lbList.length)%lbList.length; lbShow(); }
  document.addEventListener('click', e=>{
    const g=e.target.closest && e.target.closest('.gallery img');
    if(g){ const imgs=[...g.parentElement.querySelectorAll('img')]; lbOpen(imgs.map(x=>x.src), imgs.indexOf(g)); return; }
    if(e.target===lb) lbClose();
  });
  $('lbx').onclick=lbClose; $('lbpv').onclick=()=>lbMove(-1); $('lbnx').onclick=()=>lbMove(1);
  document.addEventListener('keydown', e=>{ if(!lb.classList.contains('on')) return; if(e.key==='Escape') lbClose(); if(e.key==='ArrowLeft') lbMove(-1); if(e.key==='ArrowRight') lbMove(1); });
  let tx=null; lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50) lbMove(dx<0?1:-1); },{passive:true});
  EPISODES.forEach((ep,i)=>{ const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.textContent=ep.label||ep.tab; b.onclick=()=>{ curTab=i; render(i); }; $('tabs').appendChild(b); });
  // 편별 주소(/ep4/ 등): 해당 편 폴더의 index.html이 window.ONLY_EP='EP004' 처럼 지정하면 그 편만 보여 준다
  if (window.ONLY_EP) {
    const idx = EPISODES.findIndex(e=>e.tab===window.ONLY_EP);
    if (idx >= 0) {
      curTab = idx;
      $('searchbox').style.display = 'none'; $('tabs').style.display = 'none';
      $('allbtn').style.display = 'block'; $('allbtn').href = CH.slug + '/';
      document.querySelector('header p').textContent = (EPISODES[idx].label||EPISODES[idx].tab) + ' 영상 속 그 옷, 룩 번호로 찾아보세요';
      document.title = (EPISODES[idx].label||EPISODES[idx].tab) + ' · ' + CH.name + ' 스토어';
    }
  }
  if(!EPISODES.length){ $('searchbox').style.display='none'; $('tabs').style.display='none'; $('looks').innerHTML='<p class="empty">코디 링크를 준비하고 있어요.<br>곧 영상 속 그 옷을 올려 둘게요 🤍</p>'; } else { render(curTab); }
</script>
<script>
// 방문·클릭 통계(익명). 어느 편·룩·상품을 눌렀는지만 숫자로 모은다. IP·쿠키·이름은 저장하지 않는다. 보는 곳: /stats/
(function(){
  var U='https://mmhwibktabalqtrvblyt.supabase.co', K='sb_publishable_u4HV1l7KkTm7qRGVg_0MsA_9GmAnbZW';
  if(U.indexOf('https://')!==0 || !K) return;                       // 빌드에서 주소·키가 안 들어갔으면 아무것도 하지 않는다
  var q=new URLSearchParams(location.search);
  try{ if(q.has('nostat')){ localStorage.setItem('ootd_nostat', q.get('nostat')==='0'?'':'1'); } if(localStorage.getItem('ootd_nostat')) return; }catch(e){}   // ?nostat=1 : 이 브라우저(내 것)는 집계 제외, ?nostat=0 : 해제
  if(!/(^|\.)ootdlinks\.com$/.test(location.hostname) && !q.has('stattest')) return;   // 로컬 미리보기는 집계하지 않는다
  var sid; try{ sid=sessionStorage.getItem('osid'); if(!sid){ sid=Math.random().toString(36).slice(2)+Date.now().toString(36); sessionStorage.setItem('osid',sid); } }catch(e){ sid=Math.random().toString(36).slice(2); }
  var dev=(/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)||matchMedia('(max-width:820px)').matches)?'mobile':'desktop';
  var host=''; try{ host=document.referrer?new URL(document.referrer).hostname.replace(/^www\./,''):''; }catch(e){}
  var us=q.get('utm_source'), ut=q.get('utm_content')||q.get('utm_medium');
  var src=((us||host||'direct')+(ut?'/'+ut:'')).slice(0,80);
  function post(o){ o.ch=CH.slug; o.sid=sid; o.device=dev; o.src=src;
    try{ fetch(U+'/rest/v1/ootd_events',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(o),keepalive:true}).catch(function(){}); }catch(e){} }
  post({kind:'view', ep:window.ONLY_EP||null, path:location.pathname.slice(0,200)});
  function onItem(e){ var a=e.target.closest&&e.target.closest('a.item'); if(!a) return; var s=a.closest('.look')||{dataset:{}};
    post({kind:'click', ep:s.dataset.ep||null, look:+s.dataset.look||null, idx:+a.dataset.i||null, item:(a.dataset.name||'').slice(0,80), price:+a.dataset.price||null}); }
  document.addEventListener('click', onItem, true);
  document.addEventListener('auxclick', onItem, true);              // 휠 클릭(새 탭)도 센다
  document.addEventListener('click', function(e){ var g=e.target.closest&&e.target.closest('.gallery img'); if(!g) return; var s=g.closest('.look'); if(s) post({kind:'gallery', ep:s.dataset.ep, look:+s.dataset.look}); }, true);
  // 룩이 화면에 절반 이상 보이면 '봤다'(한 탭에서 룩마다 1번)
  var seen={};
  if('IntersectionObserver' in window){
    var TH=[]; for(var t=0;t<=20;t++) TH.push(t/20);                // 룩이 화면보다 길어도 잡히도록: 룩의 절반이 보이거나, 화면 높이의 40% 이상을 차지하면 '봤다'
    var io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(!en.isIntersecting) return; if(en.intersectionRatio<0.5 && en.intersectionRect.height<window.innerHeight*0.4) return; var s=en.target, k=s.dataset.ep+'|'+s.dataset.look; if(seen[k]) return; seen[k]=1; io.unobserve(s); post({kind:'look_seen', ep:s.dataset.ep, look:+s.dataset.look}); }); },{threshold:TH});
    var watch=function(){ document.querySelectorAll('#looks .look').forEach(function(s){ if(!seen[s.dataset.ep+'|'+s.dataset.look]) io.observe(s); }); };
    new MutationObserver(watch).observe(document.getElementById('looks'),{childList:true}); watch();
  }
  // 검색창에 친 낱말(무슨 옷을 찾는지)
  var st=null, last=''; var qi=document.getElementById('q');
  if(qi) qi.addEventListener('input', function(){ clearTimeout(st); st=setTimeout(function(){ var v=qi.value.trim().slice(0,40); if(v && v!==last){ last=v; post({kind:'search', q:v}); } },1500); });
})();
</script>
</body>
</html>
