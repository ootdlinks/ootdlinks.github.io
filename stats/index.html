<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OOTD 클릭 통계</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#141414;--sub:#6b6b6b;--line:#e6e6e2;--accent:#0a7c3a;--accent2:#e8f5ee;--pink:#c2417a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(26px,5vw,40px);margin:8px 0 6px;letter-spacing:-.02em}
.badge{display:inline-block;background:var(--accent2);color:var(--accent);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.lead{color:var(--sub);font-size:14px;line-height:1.6;margin:0 0 18px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.ctl input,.ctl select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.ctl input{flex:1 1 220px}
.ctl input[type=checkbox]{flex:none;width:16px;height:16px;padding:0;margin:0}
.ctl .toggle{flex:0 0 auto;white-space:nowrap;margin:0;padding:0 4px;align-self:center}
.ctl button{font:inherit;font-weight:700;padding:12px 22px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}
.stamp{color:var(--sub);font-size:12.5px;margin:6px 0 18px;min-height:1em}
.err{color:#b42318;font-size:14px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px}
.card h2{font-size:16px;margin:0 0 4px}
.card .hint{color:var(--sub);font-size:12.5px;margin:0 0 12px;line-height:1.55}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{color:var(--sub);font-size:12.5px;display:block}
.kpi b{font-size:28px;letter-spacing:-.02em;display:block;margin-top:4px}
.kpi em{font-style:normal;color:var(--accent);font-size:12.5px;font-weight:700}
.tip{background:#fff8e6;border-color:#f1dfa8}
.tip li{margin:4px 0;line-height:1.55;font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
td.nm{white-space:normal;min-width:170px;text-align:left}
td.nm small{display:block;color:var(--sub);font-size:11.5px}
.bar{height:8px;border-radius:99px;background:var(--accent);min-width:2px}
.barbg{background:var(--accent2);border-radius:99px;width:100%;min-width:60px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.days div{flex:1;min-width:3px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.days div.c{background:var(--pink)}
.legend{font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.zero{color:#aaa}
.toggle{font-size:13px;color:var(--sub);margin:0 0 10px;display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">관리자 전용</span>
  <h1>OOTD 클릭 통계</h1>
  <p class="lead">고객이 링크 페이지에서 실제로 어떤 옷을 눌렀는지 보여요. 열쇠가 있어야 숫자가 보여요. 개인을 알아볼 수 있는 정보는 저장하지 않아요.<br>내 방문을 빼려면 링크 페이지 주소 뒤에 <b>?nostat=1</b>을 붙여 한 번 열어 두세요(그 브라우저는 집계 제외, 해제는 ?nostat=0).</p>
  <div class="ctl">
    <input id="key" type="password" placeholder="통계 열쇠" autocomplete="off">
    <select id="days"><option value="7">최근 7일</option><option value="14">최근 14일</option><option value="30" selected>최근 30일</option><option value="90">최근 90일</option></select>
    <button id="go">새로고침</button>
    <label class="toggle" style="margin:0"><input type="checkbox" id="auto"> 10초마다 자동</label>
    <label class="toggle" style="margin:0"><input type="checkbox" id="mask"> 채널명 가리기</label>
  </div>
  <div id="chtabs" class="ctl" style="margin-top:-4px"></div>
  <div id="stamp" class="stamp"></div>
  <div id="err" class="err"></div>
  <div id="cp"></div>
  <div id="out"></div>
</div>
<script>
(function(){
  var U='https://mmhwibktabalqtrvblyt.supabase.co', K='sb_publishable_u4HV1l7KkTm7qRGVg_0MsA_9GmAnbZW', CH='all', DV='20261114161927';
  var CHN={minji:'민지',yaar:'야르',peachmilk:'하린',denimdaily:'지우'}, CHS=['minji','yaar','peachmilk','denimdaily'];
  try{ var sc=localStorage.getItem('ootd_stats_ch'); if(sc==='all'||CHN[sc]) CH=sc; }catch(e){}
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
  var n0=function(n){return (+n||0).toLocaleString('ko-KR')};
  var pct=function(a,b){return b?(Math.round(a/b*1000)/10)+'%':'-'};
  var pctv=function(a,b){return (b&&a<=b)?'방문자의 '+pct(a,b):'방문 기록이 일부 빠진 기간'};
  var won=function(n){return n?n.toLocaleString('ko-KR')+'원':'-'};
  try{ var sk=localStorage.getItem('ootd_stats_key'); if(sk) $('key').value=sk; }catch(e){}

  // ── 상품 종류·색·가격대 분류(상품 이름의 낱말로 짐작) ──
  var CATS=[['원피스',/원피스|드레스/],['아우터',/자켓|재킷|코트|패딩|점퍼|무스탕|트렌치|가디건|집업|야상|베스트|조끼|케이프|퍼 /],['스커트',/스커트|치마/],['바지',/팬츠|바지|슬랙스|데님|청바지|레깅스|조거|쇼츠/],['신발',/부츠|슈즈|로퍼|플랫|힐|스니커|샌들|구두|워커|메리제인/],['가방',/가방|숄더|토트|크로스|클러치|백팩/],['잡화',/귀걸이|목걸이|머플러|목도리|벨트|모자|베레|장갑|양말|스타킹|타이즈|헤어|반지|팔찌|선글라스|안경|리본핀|비니|이어머프/],['상의',/니트|블라우스|티셔츠|셔츠|맨투맨|후드|스웨터|나시|탑|폴라|이너|캐미|티$|슬리브/]];
  var COLORS=[['블랙',/블랙|검정|검은/],['화이트·아이보리',/화이트|흰|아이보리|크림|오프화이트|우유/],['베이지·카멜',/베이지|카멜|샌드|오트밀|라떼/],['브라운',/브라운|초콜릿|모카|갈색|초코/],['그레이',/그레이|차콜|회색/],['네이비·블루',/네이비|남색|블루|청|데님/],['버건디·레드',/버건디|와인|레드|빨강|체리/],['핑크·퍼플',/핑크|로즈|연분홍|라벤더|퍼플|보라/],['그린·카키',/카키|그린|올리브|민트/],['옐로·오렌지',/옐로|노랑|머스터드|오렌지/]];
  var BANDS=[['1만원 미만',0,10000],['1~2만원',10000,20000],['2~3만원',20000,30000],['3~5만원',30000,50000],['5만원 이상',50000,1e9]];
  var cat=function(nm){for(var i=0;i<CATS.length;i++) if(CATS[i][1].test(nm)) return CATS[i][0]; return '기타'};
  var col=function(nm){for(var i=0;i<COLORS.length;i++) if(COLORS[i][1].test(nm)) return COLORS[i][0]; return '색 표기 없음'};
  var band=function(p){if(!p) return '가격 미상'; for(var i=0;i<BANDS.length;i++) if(p>=BANDS[i][1]&&p<BANDS[i][2]) return BANDS[i][0]; return '가격 미상'};

  // 현재 링크 페이지에 걸려 있는 모든 상품(클릭 0개인 상품도 비교하려면 필요). 4채널 데이터 파일을 읽어 온다.
  var CATALOG=[];
  function loadCatalog(){
    return Promise.all(CHS.map(function(c){
      return fetch('../data/'+c+'.js?v='+DV).then(function(r){return r.ok?r.text():''}).then(function(t){
        if(!t) return;
        try{ var EP=(new Function(t+';return EPISODES;'))();
          EP.forEach(function(ep){ ep.looks.forEach(function(l,n){ l.items.filter(function(it){return !it.hide}).forEach(function(it,ii){ CATALOG.push({ch:c,ep:ep.tab,label:ep.label||ep.tab,look:n+1,lookName:l.name,idx:ii+1,name:it.name,price:it.price||0}); }); }); });
        }catch(e){}
      }).catch(function(){});
    }));
  }
  var catOf=function(){ return CH==='all'?CATALOG:CATALOG.filter(function(c){return c.ch===CH}); };
  var MASK=false, MK={minji:'A 채널',yaar:'B 채널',peachmilk:'C 채널',denimdaily:'D 채널'}, LAST=null;
  try{ MASK=localStorage.getItem('ootd_stats_mask')==='1'; }catch(e){}
  var chn=function(c){return MASK?(MK[c]||'채널'):(CHN[c]||c)};
  var multi=function(){return CH==='all'};

  function group(rows,keyFn){ var m={}; rows.forEach(function(r){ var k=keyFn(r); (m[k]=m[k]||{key:k,items:0,clicks:0}); m[k].items++; m[k].clicks+=r.clicks; }); return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){ return (b.clicks/(b.items||1))-(a.clicks/(a.items||1)) || b.clicks-a.clicks; }); }
  function groupTable(title,hint,g){
    var tot=g.reduce(function(s,x){return s+x.clicks},0), mx=Math.max.apply(null,g.map(function(x){return x.items?x.clicks/x.items:0}).concat([0.0001]));
    var rows=g.map(function(x){ var per=x.items?x.clicks/x.items:0; return '<tr><td>'+esc(x.key)+'</td><td>'+x.items+'</td><td>'+n0(x.clicks)+'</td><td>'+pct(x.clicks,tot)+'</td><td><b>'+(Math.round(per*10)/10)+'</b></td><td style="min-width:90px"><div class="barbg"><div class="bar" style="width:'+Math.round(per/mx*100)+'%"></div></div></td></tr>'; }).join('');
    return '<div class="card"><h2>'+title+'</h2><p class="hint">'+hint+'</p><div class="scroll"><table><thead><tr><th>분류</th><th>상품 수</th><th>클릭</th><th>점유</th><th>상품 1개당 클릭</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  function render(d){
    var T=d.totals, out='', CAT=catOf();
    out+='<div class="kpis">'
      +'<div class="kpi"><small>방문자(추정)</small><b>'+n0(T.visitors)+'</b></div>'
      +'<div class="kpi"><small>페이지뷰</small><b>'+n0(T.views)+'</b></div>'
      +'<div class="kpi"><small>상품 클릭</small><b>'+n0(T.clicks)+'</b></div>'
      +'<div class="kpi"><small>클릭한 사람</small><b>'+n0(T.clickers)+'</b><em>'+pctv(T.clickers,T.visitors)+'</em></div>'
      +'<div class="kpi"><small>룩을 본 사람</small><b>'+n0(T.seers)+'</b><em>'+pctv(T.seers,T.visitors)+'</em></div></div>';

    if(multi()){
      var chs=(d.channels||[]);
      out+='<div class="card"><h2>채널 비교</h2><p class="hint">클릭률 = 클릭한 사람 ÷ 방문자. 채널별 반응을 나란히 봐요.</p><div class="scroll"><table><thead><tr><th>채널</th><th>방문자</th><th>페이지뷰</th><th>룩 본 사람</th><th>클릭한 사람</th><th>클릭률</th><th>클릭</th></tr></thead><tbody>'
        +CHS.map(function(c){ var x=chs.filter(function(y){return y.ch===c})[0]||{views:0,visitors:0,seers:0,clicks:0,clickers:0}; return '<tr><td class="nm">'+esc(chn(c))+'<small>'+(MASK?'':c)+'</small></td><td>'+n0(x.visitors)+'</td><td>'+n0(x.views)+'</td><td>'+n0(x.seers)+'</td><td>'+n0(x.clickers)+'</td><td><b>'+pct(x.clickers,x.visitors)+'</b></td><td>'+n0(x.clicks)+'</td></tr>'; }).join('')
        +'</tbody></table></div></div>';
    }

    // 상품별: 클릭 기록 + 현재 걸린 상품(클릭 0)
    var by={}; (d.items||[]).forEach(function(r){ by[r.ch+'|'+r.ep+'|'+r.look+'|'+r.item]=r; });
    var rows=CAT.map(function(c){ var r=by[c.ch+'|'+c.ep+'|'+c.look+'|'+c.name]; return {ch:c.ch,ep:c.ep,label:c.label,look:c.look,lookName:c.lookName,name:c.name,price:c.price,clicks:r?r.clicks:0,people:r?r.people:0}; });
    var inCat={}; CAT.forEach(function(c){ inCat[c.ch+'|'+c.ep+'|'+c.look+'|'+c.name]=1; });
    (d.items||[]).forEach(function(r){ if(!inCat[r.ch+'|'+r.ep+'|'+r.look+'|'+r.item]) rows.push({ch:r.ch,ep:r.ep,label:r.ep,look:r.look,lookName:'(지금은 걸려 있지 않은 상품)',name:r.item,price:r.price,clicks:r.clicks,people:r.people}); });
    rows.sort(function(a,b){return b.clicks-a.clicks||b.people-a.people});
    var clicked=rows.filter(function(r){return r.clicks>0}), maxc=Math.max.apply(null,rows.map(function(r){return r.clicks}).concat([1]));

    // 다음 편 힌트
    var hints=[], gC=group(rows,function(r){return cat(r.name)}), gK=group(rows,function(r){return col(r.name)}), gB=group(rows,function(r){return band(r.price)});
    if(T.clicks>=20){
      var tc=gC.filter(function(x){return x.key!=='기타'&&x.items>=2})[0], tk=gK.filter(function(x){return x.key!=='색 표기 없음'&&x.items>=2})[0], tb=gB.filter(function(x){return x.key!=='가격 미상'&&x.items>=2})[0];
      if(tc) hints.push('상품 1개당 클릭이 가장 높은 종류: <b>'+esc(tc.key)+'</b> (1개당 '+(Math.round(tc.clicks/tc.items*10)/10)+'회)');
      if(tk) hints.push('색은 <b>'+esc(tk.key)+'</b> 계열이 잘 눌려요 (1개당 '+(Math.round(tk.clicks/tk.items*10)/10)+'회)');
      if(tb) hints.push('가격대는 <b>'+esc(tb.key)+'</b>가 강해요 (1개당 '+(Math.round(tb.clicks/tb.items*10)/10)+'회)');
      if(clicked[0]) hints.push('가장 많이 눌린 상품: <b>'+esc(clicked[0].name)+'</b> ('+(multi()?esc(chn(clicked[0].ch))+' ':'')+esc(clicked[0].label)+' Look '+clicked[0].look+', '+clicked[0].clicks+'회)');
      hints.push('아직 표본이 적으면 참고만 하세요. 클릭이 룩당 수십 건 쌓이기 전에는 우연일 수 있어요.');
    } else hints.push('클릭이 아직 '+T.clicks+'건이라 경향을 말하기엔 일러요. 20건 이상 쌓이면 여기에 다음 편 아이템 힌트가 나와요.');
    out+='<div class="card tip"><h2>다음 편 아이템 고를 때 참고</h2><ul style="margin:8px 0 0;padding-left:18px">'+hints.map(function(h){return '<li>'+h+'</li>'}).join('')+'</ul></div>';

    out+='<div class="card"><h2>상품별 클릭 순위</h2><p class="hint">지금 링크 페이지에 걸려 있는 상품 전부를 보여요(0회 포함). 같은 사람이 여러 번 눌러도 "클릭"은 모두 세고, "사람"은 한 번만 세요.</p>'
      +'<label class="toggle"><input type="checkbox" id="z"> 클릭 0회 상품도 보기</label><div class="scroll"><table id="itbl"><thead><tr><th>상품</th><th>가격</th><th>클릭</th><th>사람</th><th></th></tr></thead><tbody>'
      +rows.map(function(r,i){ return '<tr class="'+(r.clicks?'':'zr')+'" '+(r.clicks?'':'hidden')+'><td class="nm">'+(i+1)+'. '+esc(r.name)+'<small>'+(multi()?esc(chn(r.ch))+' · ':'')+esc(r.label)+' · Look '+r.look+' '+esc(r.lookName)+'</small></td><td>'+won(r.price)+'</td><td><b>'+n0(r.clicks)+'</b></td><td>'+n0(r.people)+'</td><td style="min-width:90px"><div class="barbg"><div class="bar" style="width:'+Math.round(r.clicks/maxc*100)+'%"></div></div></td></tr>'; }).join('')
      +'</tbody></table></div></div>';

    // 룩별
    var lk=(d.looks||[]).map(function(r){ var nm=''; CAT.some(function(c){ if(c.ch===r.ch&&c.ep===r.ep&&c.look===r.look){nm=c.lookName;return true} }); return {ch:r.ch,ep:r.ep,look:r.look,nm:nm,seen:r.seen,clicks:r.clicks,clickers:r.clickers,zooms:r.zooms}; }).sort(function(a,b){ return (b.seen?b.clickers/b.seen:0)-(a.seen?a.clickers/a.seen:0)||b.clicks-a.clicks; });
    out+='<div class="card"><h2>룩별 클릭률</h2><p class="hint">"본 사람"은 그 룩이 화면에 충분히 보인 사람이에요(룩의 절반, 또는 화면의 40% 이상). 클릭률 = 클릭한 사람 ÷ 본 사람. 사진 확대는 갤러리를 눌러 크게 본 횟수예요.</p><div class="scroll"><table><thead><tr><th>룩</th><th>본 사람</th><th>클릭한 사람</th><th>클릭률</th><th>클릭</th><th>사진 확대</th></tr></thead><tbody>'
      +lk.map(function(r){ return '<tr><td class="nm">'+(multi()?esc(chn(r.ch))+' · ':'')+esc(r.ep)+' · Look '+r.look+'<small>'+esc(r.nm)+'</small></td><td>'+n0(r.seen)+'</td><td>'+n0(r.clickers)+'</td><td><b>'+pct(r.clickers,r.seen)+'</b></td><td>'+n0(r.clicks)+'</td><td>'+n0(r.zooms)+'</td></tr>'; }).join('')+'</tbody></table></div></div>';

    out+=groupTable('종류별','상품 이름의 낱말로 종류를 짐작해요. "상품 1개당 클릭"이 높은 종류가 잘 팔릴 후보예요.',gC);
    out+='<div class="grid2">'+groupTable('색 계열별','상품 이름에 적힌 색 낱말 기준이에요.',gK)+groupTable('가격대별','',gB)+'</div>';

    // 일별
    var dm=Math.max.apply(null,(d.daily||[]).map(function(x){return Math.max(x.visitors,x.clickers)}).concat([1]));
    out+='<div class="card"><h2>하루별 방문자와 클릭한 사람</h2><div class="days">'+(d.daily||[]).map(function(x){return '<div title="'+x.day+' 방문 '+x.visitors+' / 클릭한 사람 '+x.clickers+'" style="height:'+Math.max(2,Math.round(x.visitors/dm*100))+'%"></div><div class="c" title="'+x.day+'" style="height:'+Math.max(2,Math.round(x.clickers/dm*100))+'%"></div>'}).join('')+'</div><div class="legend"><i style="background:var(--accent)"></i>방문자<i style="background:var(--pink)"></i>클릭한 사람</div></div>';

    // 시간대
    var hr={}; (d.hours||[]).forEach(function(x){hr[x.hour]=x}); var hm=Math.max.apply(null,(d.hours||[]).map(function(x){return x.views}).concat([1])), hh='';
    for(var h=0;h<24;h++){ var x=hr[h]||{views:0,clicks:0}; hh+='<div title="'+h+'시 방문 '+x.views+' / 클릭 '+x.clicks+'" style="height:'+Math.max(2,Math.round(x.views/hm*100))+'%"></div>'; }
    out+='<div class="grid2"><div class="card"><h2>시간대별 방문</h2><p class="hint">한국 시간, 0시~23시</p><div class="days">'+hh+'</div></div>';
    out+='<div class="card"><h2>어디서 들어왔나</h2><p class="hint">ig/dm = 댓글 DM 링크, ig/link_in_bio = 프로필 링크</p><div class="scroll"><table><thead><tr><th>유입</th><th>방문</th><th>클릭</th></tr></thead><tbody>'+(d.srcs||[]).map(function(x){return '<tr><td>'+esc(x.src)+'</td><td>'+n0(x.views)+'</td><td>'+n0(x.clicks)+'</td></tr>'}).join('')+'</tbody></table></div></div></div>';

    out+='<div class="grid2"><div class="card"><h2>편별</h2><div class="scroll"><table><thead><tr><th>편</th><th>방문</th><th>클릭</th></tr></thead><tbody>'+(d.eps||[]).map(function(x){return '<tr><td>'+(multi()?esc(chn(x.ch))+' · ':'')+esc(x.ep)+'</td><td>'+n0(x.views)+'</td><td>'+n0(x.clicks)+'</td></tr>'}).join('')+'</tbody></table></div><p class="hint" style="margin-top:8px">방문은 편별 주소(/ootd01/ 등)로 들어온 횟수만 잡혀요.</p></div>'
      +'<div class="card"><h2>검색창에 친 말</h2><p class="hint">고객이 찾는 옷이에요. 다음 편 소재 후보예요.</p>'+((d.searches||[]).length?'<div class="scroll"><table><tbody>'+d.searches.map(function(x){return '<tr><td>'+esc(x.q)+'</td><td>'+n0(x.n)+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="hint">아직 없어요.</p>')+'</div></div>';
    out+='<div class="card"><h2>기기</h2><div class="scroll"><table><thead><tr><th>기기</th><th>방문</th><th>클릭</th></tr></thead><tbody>'+(d.devices||[]).map(function(x){return '<tr><td>'+esc(x.device==='mobile'?'모바일':x.device==='desktop'?'컴퓨터':x.device)+'</td><td>'+n0(x.views)+'</td><td>'+n0(x.clicks)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
    $('out').innerHTML=out;
    var z=$('z'); if(z) z.onchange=function(){ [].forEach.call(document.querySelectorAll('#itbl .zr'),function(tr){ tr.hidden=!z.checked }); };
  }


  // 쿠팡 파트너스 성과(채널 ID별 클릭·구매·수익). 데이터는 coupang_sync.py 가 쿠팡 API에서 읽어 Supabase에 올려 둔 것이다.
  var SUB2CH={minjiatnight:'minji',yaarootd:'yaar'};
  function loadCoupang(k){
    var box=$('cp'); if(!box||!k) return;
    fetch(U+'/rest/v1/rpc/get_coupang_stats',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_key:k,p_days:+$('days').value})})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        var by=(d.by_sub||[]).filter(function(x){ return CH==='all'||SUB2CH[x.sub_id]===CH; });
        var ords=(d.orders||[]).filter(function(x){ return CH==='all'||SUB2CH[x.sub_id]===CH; });
        var nm=function(s){ var c=SUB2CH[s]; return c?chn(c):(MASK?'다른 채널':(s||'(채널ID 없음)')); };
        var tc=0,to=0,tg=0,tm=0; by.forEach(function(x){ tc+=+x.clicks; to+=+x.orders; tg+=+x.gmv; tm+=+x.commission; });
        var h='<div class="card"><h2>쿠팡 파트너스 성과</h2><p class="hint">쿠팡 파트너스에 잡힌 숫자예요(채널 ID별). 클릭은 쿠팡 링크를 눌러 쿠팡으로 넘어간 횟수, 구매는 주문 건수, 수익은 예상 수수료예요. 쿠팡이 확정하기 전 값이라 취소·반품되면 줄어들 수 있어요.'+(d.updated?' 마지막 갱신 '+new Date(d.updated).toLocaleString('ko-KR')+'.':'')+'</p>'
          +'<div class="kpis"><div class="kpi"><small>쿠팡 클릭</small><b>'+n0(tc)+'</b></div><div class="kpi"><small>구매(주문 건)</small><b>'+n0(to)+'</b></div><div class="kpi"><small>구매금액 합계</small><b>'+won(tg)+'</b></div><div class="kpi"><small>예상 수익</small><b>'+won(tm)+'</b><em>구매 '+pct(to,tc)+'</em></div><div class="kpi"><small>클릭당 수익</small><b>'+(tc?Math.round(tm/tc)+'원':'-')+'</b></div></div>'
          +'<div class="scroll"><table><thead><tr><th>채널</th><th>클릭</th><th>구매</th><th>구매금액</th><th>수익</th><th>클릭당 수익</th></tr></thead><tbody>'
          +(by.length?by.map(function(x){ return '<tr><td class="nm">'+esc(nm(x.sub_id))+(MASK?'':'<small>'+esc(x.sub_id||'')+'</small>')+'</td><td>'+n0(x.clicks)+'</td><td>'+n0(x.orders)+'</td><td>'+won(+x.gmv)+'</td><td><b>'+won(+x.commission)+'</b></td><td>'+(+x.clicks?Math.round(+x.commission/+x.clicks)+'원':'-')+'</td></tr>'; }).join(''):'<tr><td colspan="6" class="hint">이 기간 기록이 없어요.</td></tr>')
          +'</tbody></table></div>'
          +'<h2 style="margin-top:18px">실제로 산 상품</h2><div class="scroll"><table><thead><tr><th>상품</th><th>수량</th><th>구매금액</th><th>수익</th></tr></thead><tbody>'
          +(ords.length?ords.slice(0,40).map(function(x){ return '<tr><td class="nm">'+esc((x.product||'').slice(0,60))+'<small>'+esc(x.day)+' · '+esc(nm(x.sub_id))+(x.category?' · '+esc(x.category):'')+'</small></td><td>'+n0(x.qty)+'</td><td>'+won(+x.gmv)+'</td><td>'+won(+x.commission)+'</td></tr>'; }).join(''):'<tr><td colspan="4" class="hint">구매가 아직 없어요.</td></tr>')
          +'</tbody></table></div></div>';
        box.innerHTML=h;
      })
      .catch(function(e){ box.innerHTML='<div class="card"><h2>쿠팡 파트너스 성과</h2><p class="hint">아직 불러올 수 없어요. 12_coupang.sql 실행과 coupang_sync.py 실행이 필요해요. ('+esc(e.message)+')</p></div>'; });
  }

  function drawTabs(){
    $('chtabs').innerHTML=['all'].concat(CHS).map(function(c){ return '<button data-c="'+c+'" style="'+(c===CH?'':'opacity:.55')+'">'+(c==='all'?'전체 채널':chn(c))+'</button>'; }).join('');
    [].forEach.call($('chtabs').querySelectorAll('button'),function(b){ b.onclick=function(){ CH=b.getAttribute('data-c'); try{localStorage.setItem('ootd_stats_ch',CH);}catch(e){} drawTabs(); if($('key').value.trim()) load(); }; });
  }
  drawTabs();
  var mk=$('mask'); mk.checked=MASK;
  mk.onchange=function(){ MASK=mk.checked; try{localStorage.setItem('ootd_stats_mask',MASK?'1':'0');}catch(e){} drawTabs(); if(LAST) render(LAST); };
  var au=$('auto'), timer=null;
  try{ au.checked=localStorage.getItem('ootd_stats_auto')==='1'; }catch(e){}
  function setAuto(){ if(timer){clearInterval(timer);timer=null;} if(au.checked) timer=setInterval(function(){ if($('key').value.trim()&&!document.hidden) load(true); },10000); try{localStorage.setItem('ootd_stats_auto',au.checked?'1':'0');}catch(e){} }
  au.onchange=setAuto;
  var ready=loadCatalog();
  function load(quiet){
    if($('go').disabled) return;
    var k=$('key').value.trim(); if(quiet!==true) $('err').textContent='';
    if(U.indexOf('https://')!==0){ $('err').textContent='통계 주소가 빌드에 들어가지 않았어요(.env 확인).'; return; }
    if(!k){ $('err').textContent='열쇠를 입력해 주세요.'; return; }
    $('go').disabled=true; if(quiet!==true) $('stamp').textContent='불러오는 중…';
    fetch(U+'/rest/v1/rpc/get_ootd_stats',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_key:k,p_days:+$('days').value,p_ch:CH})})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ try{ localStorage.setItem('ootd_stats_key',k); }catch(e){} return ready.then(function(){return d}); }).then(function(d){ LAST=d; var zc=$('z')&&$('z').checked; var sy=window.pageYOffset; render(d); if(zc&&$('z')){ $('z').checked=true; $('z').onchange(); } window.scrollTo(0,sy); var t=new Date(); $('stamp').textContent='최근 '+d.days+'일 · '+t.toLocaleString('ko-KR')+' 기준'; loadCoupang(k); })
      .catch(function(e){ $('stamp').textContent=''; $('err').textContent=(String(e.message)==='401'||String(e.message)==='403'||String(e.message)==='400')?'열쇠가 맞지 않아요.':'불러오지 못했어요. SQL(10_ootd_events.sql)을 실행했는지 확인해 주세요. ('+e.message+')'; })
      .finally(function(){ $('go').disabled=false; });
  }
  $('go').onclick=function(){ load(); }; $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') load(); });
  setAuto(); if($('key').value) load();
})();
</script>
</body>
